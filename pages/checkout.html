    <main class="container py-5 mt-5">
        <h1 class="display-5 fw-bold text-danger-emphasis text-center text-sm-start mb-4">Checkout</h1>

        <div class="row g-4">
            <div class="col">

                <div class="card shadow-sm mb-4">

                    <div class="card-header bg-danger text-light fw-semibold">
                        Checkout Overview
                    </div>

                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <img src="../assets/cupcake/cupcake-1.webp"
                                class="img-fluid me-3 border border-danger border-2"
                                style="width:120px; object-fit: cover;" alt="basta cupcake">
                            <div class="flex-fill">
                                <h6 class="mb-1 font-monospace">Basta Cupcake</h6>
                                <small class="text-muted">8 pcs.</small>
                            </div>
                            <div class="text-end">
                                <p class="mb-1 fw-semibold text-danger-emphasis font-monospace fst-italic">₱410.00</p>
                                <small class="text-muted">Qty: 1</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col">

                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-danger text-light fw-semibold">
                                Payment Method
                            </div>

                            <div class="card-body d-flex flex-column justify-content-center font-monospace">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="cod"
                                        value="Cash on Delivery" required>
                                    <label class="form-check-label" for="cod">
                                        Cash on Delivery
                                    </label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="gcash"
                                        value="GCash" required>
                                    <label class="form-check-label" for="gcash">
                                        GCash
                                    </label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="card"
                                        value="Credit/Debit Card" required>
                                    <label class="form-check-label" for="card">
                                        Credit/Debit Card
                                    </label>
                                </div>
                            </div>

                        </div>
                    </div>
