<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/styles.css">
    <script src="/script.js"></script>
    <title>Miks N' Bakes</title>
    <link rel="icon" type="image/x-icon" href="/assets/logo.svg">
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg bg-danger fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand text-light fw-semibold">Miks n' Bakes</a>

            <div class="dropdown ms-auto">
                <button class="btn btn-link text-light" type="button" id="dropdownIcons" data-bs-toggle="dropdown"
                    aria-expanded="false" data-bs-auto-close="outside">
                    <i class="bi bi-three-dots-vertical fs-4"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end bg-danger" aria-labelledby="dropdownIcons">

                    <a href="/pages/cart.html" class="dropdown-item text-light">
                        <i class="bi bi-cart3 me-2"></i> Cart
                    </a>

                    <a href="/pages/user-profile.html" class="dropdown-item text-light">
                        <i class="bi bi-person-circle me-2"></i> Profile
                    </a>

                    <a tabindex="0" type="button" class="dropdown-item text-light" data-bs-toggle="popover"
                        data-bs-trigger="focus" data-bs-placement="bottom" data-bs-custom-class="notif"
                        data-bs-title="Notifications" data-bs-content="No new notifications.">
                        <i class="bi bi-bell me-2"></i> Notifications
                    </a>

                </ul>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end bg-danger" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav ms-auto fw-medium">
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="/index.html#home" class="text-light text-decoration-none p-2">Home</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="/index.html#featured" class="text-light text-decoration-none p-2">Featured</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="/pages/menu.html" class="text-light text-decoration-none p-2">Menu</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="/index.html#contacts" class="text-light text-decoration-none p-2">Contacts</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="/pages/about.html" class="text-light text-decoration-none p-2">About</a>
                        </button>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="container-fluid p-5 mt-4">
            <h1 class="display-4 text-danger fw-semibold text-center">
                Your Cart
            </h1>

            <div class="border text-center text-danger rounded py-5 shadow-lg">
                <i class="bi bi-cart-x display-1 "></i>
                <h3 class="mt-3 fw-semibold">Your cart is empty</h3>
                <p class="text-muted">Looks like you haven’t added any items yet.</p>
                <a href="menu.html" class="btn btn-outline-danger border-2 px-4 py-2 mt-2">Browse Menu</a>
            </div>

            <div class="row justify-content-end mt-4">
                <div class="col-md-4">
                    <div class="rounded p-4 shadow-sm bg-danger text-light">
                        <h5 class="fw-semibold mb-3">Order Summary</h5>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="fw-medium">Subtotal</span>
                            <span class="font-monospace fst-italic fw-medium fs-4">₱0</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="fw-medium">Delivery Fee</span>
                            <span class="font-monospace fst-italic fw-medium fs-4">₱0</span>
                        </div>

                        <hr class="border border-light opacity-100">

                        <div class="d-flex justify-content-between mb-3 fs-2">
                            <span class="fw-semibold">Total</span>
                            <span class="font-monospace fst-italic fw-medium">₱0</span>
                        </div>

                        <a class="btn btn-light text-danger w-100 p-2 fs-5" href="/pages/checkout.html">
                            Check Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-danger p-3">
        <div class="container-fluid">
            <div class="text-light text-center">
                <h3>Miks n' Bakes</h3>
                <p class="fst-italic">A touch of elegance in every bite.</p>

                <p class="mt-3 mb-0">&copy; 2025 Miks n' Bakes. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
