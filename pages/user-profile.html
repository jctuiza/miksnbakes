<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js"></script>
    <title>Miks N' Bakes</title>
    <link rel="icon" type="image/x-icon" href="../assets/logo.svg">
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg bg-danger fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand text-light fw-semibold">Miks n' Bakes</a>

            <div class="dropdown ms-auto">
                <button class="btn btn-link text-light" type="button" id="dropdownIcons" data-bs-toggle="dropdown"
                    aria-expanded="false" data-bs-auto-close="outside">
                    <i class="bi bi-three-dots-vertical fs-4"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end bg-danger" aria-labelledby="dropdownIcons">

                    <a href="cart.html" class="dropdown-item text-light">
                        <i class="bi bi-cart3 me-2"></i> Cart
                    </a>

                    <a href="user-profile.html" class="dropdown-item text-light">
                        <i class="bi bi-person-circle me-2"></i> Profile
                    </a>

                    <a tabindex="0" type="button" class="dropdown-item text-light" data-bs-toggle="popover"
                        data-bs-trigger="focus" data-bs-placement="bottom" data-bs-custom-class="notif"
                        data-bs-title="Notifications" data-bs-content="No new notifications.">
                        <i class="bi bi-bell me-2"></i> Notifications
                    </a>

                </ul>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end bg-danger" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav ms-auto fw-medium">
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="../index.html#home" class="text-light text-decoration-none p-2">Home</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="../index.html#featured" class="text-light text-decoration-none p-2">Featured</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="menu.html" class="text-light text-decoration-none p-2">Menu</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="../index.html#contacts" class="text-light text-decoration-none p-2">Contacts</a>
                        </button>
                        <button type="button" class="btn btn-link nav-link" data-bs-dismiss="offcanvas">
                            <a href="about.html" class="text-light text-decoration-none p-2">About</a>
                        </button>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="container pt-5 mt-5">
            <h1 class="display-5 fw-bold text-danger-emphasis text-center text-sm-start mb-4">User Profile</h1>

            <div class="card shadow border-0 my-4">
                <div class="card-body">

                    <div class="text-center mb-3">
                        <div class="text-center mb-4">
                            <img src="../assets/beastcoders/pogi.jpg" alt="Profile Picture"
                                class="rounded-circle img-fluid border border-danger border-3"
                                style="width: 150px; height: 150px; object-fit: cover;">

                            <h2 class="mt-3 fw-medium">Carl Julian Dinulos</h2>
                        </div>

                        <div>
                            <button class="btn btn-outline-danger btn-sm mt-2">
                                <i class="bi bi-pencil-square"></i> Edit Photo
                            </button>
                        </div>
                    </div>

                    <div class="list-group border">

                        <div class="list-group-item p-4">
                            <label class="fw-semibold">Name</label>
                            <input type="text" class="form-control mt-2" value="Carl Julian Dinulos">
                        </div>

                        <div class="list-group-item p-4">
                            <label class="fw-semibold">Bio</label>
                            <input type="text" class="form-control mt-2" placeholder="Set Bio">
                        </div>

                        <div class="list-group-item p-4">
                            <label class="fw-semibold">Gender</label>
                            <select class="form-select mt-2">
                                <option selected>Male</option>
                                <option>Female</option>
                                <option>Prefer not to say</option>
                            </select>
                        </div>

                        <div class="list-group-item p-4">
                            <label class="fw-semibold">Birthday</label>
                            <input type="date" class="form-control mt-2">
                        </div>

                        <div class="list-group-item p-4">
                            <label class="fw-semibold">Phone</label>
                            <input type="text" class="form-control mt-2">
                        </div>

                        <div class="list-group-item p-4">
                            <label class="fw-semibold">Email</label>
                            <input type="email" class="form-control mt-2" value="CJDGoat67@gmail.com">
                        </div>

                    </div>

                    <div class="mt-4 text-center">
                        <button class="btn btn-danger w-50" data-bs-toggle="modal" data-bs-target="#saveModal">Save
                            Changes</button>
                    </div>

                    <div class="mt-4 text-center">
                        <button class="btn btn-outline-danger w-50" data-bs-toggle="modal"
                            data-bs-target="#logoutModal">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </div>

                    <div class="modal fade" id="saveModal" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content text-center">

                                <div class="modal-header bg-danger text-white">
                                    <h5 class="modal-title">Changes Saved</h5>
                                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>

                                <div class="modal-body">
                                    <i class="bi bi-check-circle-fill text-danger display-4 mb-3"></i>
                                    <h4 class="fw-bold text-danger-emphasis">Changes Saved Successfully!</h4>
                                </div>

                                <div class="modal-footer justify-content-center">
                                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="logoutModal" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content text-center">

                                <div class="modal-header bg-danger text-white">
                                    <h5 class="modal-title">Logout Confirmation</h5>
                                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>

                                <div class="modal-body">
                                    <i class="bi bi-check-circle-fill text-danger display-4 mb-3"></i>
                                    <h4 class="fw-bold text-danger-emphasis">Logged Out Successfully!</h4>
                                </div>

                                <div class="modal-footer justify-content-center">
                                    <a href="../index.html" class="btn btn-danger">OK</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-danger p-3">
        <div class="container-fluid">
            <div class="text-light text-center">
                <h3>Miks n' Bakes</h3>
                <p class="fst-italic">A touch of elegance in every bite.</p>

                <p class="mt-3 mb-0">&copy; 2025 Miks n' Bakes. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
